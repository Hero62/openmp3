[workspace]
resolver = "2"
members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false }
librespot-connect = "0.8"
librespot-metadata = "0.8"
librespot-protocol = "0.8"
librespot-oauth = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
thiserror = "2"

[package]
name = "mp3palace"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
engine-common = { path = "crates/engine-common" }
engine-session = { path = "crates/engine-session" }
engine-audio = { path = "crates/engine-audio" }
engine-api = { path = "crates/engine-api" }
engine-queue = { path = "crates/engine-queue" }
tokio.workspace = true
anyhow.workspace = true
env_logger = "0.11"
tauri = { version = "2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
