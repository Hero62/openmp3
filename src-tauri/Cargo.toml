[workspace]
resolver = "2"
members = [".", "crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false }
librespot-connect = "0.8"
librespot-metadata = "0.8"
librespot-protocol = "0.8"
librespot-oauth = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
thiserror = "2"

[package]
name = "mp3palace"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
engine-common = { path = "crates/engine-common" }
engine-session = { path = "crates/engine-session" }
engine-audio = { path = "crates/engine-audio" }
engine-api = { path = "crates/engine-api" }
engine-queue = { path = "crates/engine-queue" }
tokio.workspace = true
anyhow.workspace = true
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
zune-jpeg = "0.5"
zip = { version = "8", default-features = false, features = ["deflate"] }
notify = { version = "8", default-features = false }
regex = "1"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
engine-bridge = { path = "crates/engine-bridge" }
engine-connect = { path = "crates/engine-connect" }
fastrand = "2"
tauri = { version = "2.12", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
