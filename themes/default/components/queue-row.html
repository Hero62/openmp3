<div class="mp3-q-row" data-track-uri="{{track.uri}}" data-uri="{{track.uri}}">
  {{#if track.album.images}}<img class="mp3-q-art" loading="lazy" src="{{track.album.images | img:64}}" alt="">{{else}}<span class="mp3-q-art"></span>{{/if}}
  <div class="mp3-q-text">
    <div class="mp3-truncate mp3-q-title">{{track.title}}</div>
    <div class="mp3-truncate mp3-muted">{{track.artists | artists}}</div>
  </div>
  {{#if fromUserQueue}}<button class="mp3-icon-btn mp3-q-remove" data-action="queue-remove" data-uid="{{uid}}" title="Remove from queue"><svg viewBox="0 0 24 24" class="mp3-icon"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>{{/if}}
</div>
