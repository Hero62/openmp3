<div class="mp3-dialog">
  <h3>{{title}}</h3>
  <input type="text" value="{{value}}" maxlength="200" spellcheck="false">
  <div class="mp3-dialog-actions">
    <button class="mp3-btn mp3-btn-ghost" data-prompt="cancel">Cancel</button>
    <button class="mp3-btn" data-prompt="ok">OK</button>
  </div>
</div>
